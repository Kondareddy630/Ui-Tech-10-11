<!DOCTYPE html>
<html>
<head>

<style>

    .container{
        width: 800px;
        height: 400px;
        background-color: rgb(197, 194, 194);
        margin: 50px auto;
        border-radius: 12px;
        box-shadow: 4px 4px 4px black;
        display: grid;
        /* grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr; */

        grid-template-columns: repeat(8,1fr);
        grid-template-columns: repeat(4,1fr);
        grid-template-columns: repeat(2,1fr);
        grid-template-columns: 1fr 2fr 3fr;
        gap: 10px;
    }

    .box{
        background-color: red;
      
        padding: 5px;
        color:white;

    }
      


</style>

</head>
<body>


    <div class="container">

        <div class="box">
            1
        </div>

         <div class="box">
            2
        </div>

         <div class="box">
            3
        </div>

         <div class="box">
            4
        </div>

        
         <div class="box">
            5
        </div>

        
         <div class="box">
            6
        </div>

        
         <div class="box">
            7
        </div>

        
         <div class="box">
            8
        </div>



    </div>


</body>
</html>
