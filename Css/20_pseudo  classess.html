<!DOCTYPE html>
<html>
<head>

<style>

    h1{
        font-family: cursive;
        text-align: center;
        font-size: 20px;
        color:red;
        transition: all 1s;
    }

    h1:hover{

        color:blue;
        font-size: 50px;

        transition: all 1s;
    }

    a{
        text-decoration: none;
    }

    a:hover{
        text-decoration: underline;
    }

    img{
        margin: 100px;
        width: 300px;
        height:300px;
         transition: all 1s;
         transform-origin: center right;
    }

    img:hover{
/* 
        transform: rotateX(180deg); */
        transform: rotateY(180deg);
        transform: rotate(360deg);
        transition: all 1s linear;
    }


    input{

        border: none;
        background-color: red;
        color:white;
        padding: 10px 20px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 20px;
        border-radius: 10px;
        box-shadow: 2px 2px 2px black;
        transition: all linear 1s;
    }

    input:active{
        background: green;
        color:lime;
        cursor: pointer;
        transition: all linear 1s;
    }

    a:link{
        color:green;
    }

    
    a:active{
        color:yellow;
    }

    a:hover{
        color:cyan;
    }
    a:visited{
        color:lime;
    }
   
</style>

</head>
<body>


    <a href="http://www.facebook.com">Facebook</a>

        <a href="http://www.google.com">google</a>


     <input type="submit">

    <h1>Java Full Stack</h1>
    
    <img src="../images/food10.jpg">

   




</body>
</html>
