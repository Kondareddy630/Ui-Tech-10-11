<!DOCTYPE html>
<html>
<head>

<style>

    h1{
        font-family: cursive;
        text-align: center;
        font-size: 20px;
        color:red;
        transition: all 1s;
    }

    h1:hover{

        color:blue;
        font-size: 50px;

        transition: all 1s;
    }

    a{
        text-decoration: none;
    }

    a:hover{
        text-decoration: underline;
    }

    img{
        margin: 100px;
        width: 300px;
        height:300px;
         transition: all 1s;
         transform-origin: center right;
    }

    img:hover{
/* 
        transform: rotateX(180deg); */
        transform: rotateY(180deg);
        transform: rotate(360deg);
        transition: all 1s linear;
    }
</style>

</head>
<body>

    <h1>Java Full Stack</h1>
    
    <img src="../images/food10.jpg">




</body>
</html>
