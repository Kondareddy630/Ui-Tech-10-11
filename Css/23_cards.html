<!DOCTYPE html>

    <style>
        .card {
            width: 420px;
            height: 550px;
            box-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
            margin: 100px auto;
            border-radius: 12px;
            font-family: Arial, Helvetica, sans-serif;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
        }

        .card-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .card-body div {
            overflow: hidden;
            border-radius: 12px;
        }

        .card-body img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 12px;
            display: block;
            transition: transform 1s ease;
            
        }

        .card-body img:hover {
            transform: scale(1.1);
        }

        #hello{
            display: flex;
            padding: 10px;
            gap: 10px;
        }
    </style>
</head>
