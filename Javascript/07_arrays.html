<script>

/*

Arrays: 
1.used to store multiple values in single variable.
2.js arrays are allowed same and diff type values.
3.you want access the array elemnts you have index number.
index number always start with 0.

*/


//how to declare the array

let names; // array declaration

names=[];  //

names[0]=10;
names[1]=20;
names[2]=30;
names[3]=40;
names[4]=50;

console.log(names);

// array init

let colors=["red","blue","green","orange","pink","cyan","white"];
console.log(colors);

//index number

console.log(colors[0]);
console.log(colors[1]);
console.log(colors[2]);
console.log(colors[3]);
console.log(colors[-1]);

//at()

console.log(colors.at(0));
console.log(colors.at(1));
console.log(colors.at(2));
console.log(colors.at(-1));
console.log(colors.at(-2));// new way
console.log(colors.length-1);
console.log(colors[colors.length-1]); // old way



</script>
