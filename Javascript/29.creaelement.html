<!DOCTYPE html>
<html>
<head>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>

</head>
<body class="container mt-5">



<div class="container">
    <p>para1</p>

</div>

<ol id="list1">
    <li>html</li>
    <li id="css">css</li>
</ol>


<script>
//createElement()

let h1=document.createElement("h1");

//appendChild()
document.body.appendChild(h1);
h1.innerText="Java Full Stack";
h1.style.color="red";
h1.classList.add("bg-success","text-white","text-center","p-2","rounded-4","shadow");

let li=document.createElement("li");
li.innerText="Javascript";
document.getElementById("list1").appendChild(li);

let li1=document.createElement("li");
li1.innerText="React";
document.getElementById("list1").appendChild(li1);



let li2=document.createElement("li");
li2.innerText="Angular";
document.getElementById("list1").prepend(li2);



let li3=document.createElement("li");
li3.innerText="Node js";

let li4=document.createElement("li");
li4.innerText="Express js";

let li5=document.createElement("li");
li5.innerText="Mongo Db";

document.getElementById("list1").append(li3,li4,li5);

//remove()

document.getElementById("css").remove();



</script>
    
</body>
</html>
