<!DOCTYPE html>
<html lang="en">
<head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    
</head>
<body class="container mt-5">
    

<button onclick="alert('Welcome to Js')" class="btn btn-success">Click</button> <br><br>

<div class="border shadow w-50 m-auto p-4">

<input type="text" placeholder="Number1" id="t1" class="form-control mt-2">
<input type="text" placeholder="Number2" id="t2" class="form-control mt-2">
<input type="text" placeholder="Number3" id="t3" class="form-control mt-2">

<button class="btn btn-danger m-1" onclick="t3.value=parseInt(t1.value)+parseInt(t2.value)">Add</button>

<button class="btn btn-success m-1" onclick="t3.value=t1.value-t2.value">Sub</button>

</div>


</body>
</html>
