<!DOCTYPE html>

<body>

<script>
  
//push(),unshift(),splice()=>adding new elements

let colors=["red","blue","pink","green"];
console.log(colors);

//push()=> add the new element end of the array

let length=colors.push("white","black");
console.log(colors);
console.log(length);

// unshift()=> add the new element begining of the array

let newlength=colors.unshift("pink","orange");
console.log(colors);
console.log(newlength);

//splice()

let result1=colors.splice(3,0,"hello","hai");
console.log(colors);
console.log(result1);







</script>
    
</body>
</html>
