<!DOCTYPE html>
<html>
<head>
   
</head>
<body leftmargin="100px">

<form method="get" action="hello.java">

    <div>
        <label>Username:</label>
    </div>

    <div>
        <input type="text" placeholder="Enter Username" name="username" maxlength="15" minlength="5" required>
    </div>


    <div>
        <label>Password:</label>
    </div>

    <div>
        <input type="password" placeholder="Enter Password" name="password">
    </div>


    <div>
        <label>Email</label>
    </div>

    <div>
        <input type="email" placeholder="Email Address" name="email">
    </div>


    <div>
        <label>Choose Gender:</label>
    </div>

    <div>
        <input type="radio" name="gender" value="male" checked> <label>Male</label>
        <input type="radio" name="gender" value="female"> <label>Female</label>
        <input type="radio" name="gender" value="other"> <label>Other</label>
    </div>


    <div>
        <label>Choose Course:</label>
    </div>

    <div>
        <input type="checkbox" name="course" value="java"> <label>Java</label>
        <input type="checkbox" name="course" value="python"> <label>Python</label>
        <input type="checkbox" name="course" value="ui"> <label>Ui</label>
        <input type="checkbox" name="course" value="react"> <label>React</label>
    </div>



    <div>
        <label>Choose Date:</label>
    </div>

    <div>
        <input type="date" name="date">
    </div>



    <div>
        <label>Choose Time:</label>
    </div>

    <div>
        <input type="time" name="time">
    </div>


    <div>
        <label>Choose Age:</label>
    </div>


    <div>
        <input type="range" name="age" min="18" max="50" step="5">
    </div>


   <div>
     <label>Upload Resume:</label>
   </div>

   <div>
    <input type="file" multiple>
   </div>

   <div>
    <label>Comments:</label>
   </div>

   <div>

    <textarea name="msg" placeholder="Enter Message" cols="30" rows="4">
    </textarea>


   </div>


   <div>
    <label>Choose Technology:</label>
   </div>

   <div>

    <select name="tech">
        <option>---Choose Technology---</option>
        <option>html</option>
        <option>css</option>
        <option>javascript</option>
        <option>bootstrap</option>

        <option>java</option>
        <option>python</option>
        <option>.net</option>

    </select>


   </div>


    <div>
        <input type="submit" value="Register">
        <input type="reset" value="Clear">
    </div>


</form>
    
    
</body>
</html>
