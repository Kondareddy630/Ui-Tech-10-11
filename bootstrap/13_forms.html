<!DOCTYPE html>
<html>
<head>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">



<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
  />

<style>
body{
margin-bottom: 500px;
}


</style>


</head>
<body class="container mt-5">



    <div class="input-group w-75 shadow m-auto">

        <select class="form-select input-group-text">
            <option>All</option>
            <option>Mobiles</option>
            <option>Tvs</option>
        </select>

        <input type="text" placeholder="Search Amazon.in" class="form-control">

        <span class="bi bi-search input-group-text bg-warning"></span>
        
    </div>


    <form class="border shadow  m-auto my-5 p-4 rounded-2" style="width: 450px;">

        <div>
            <h4 class="text-muted">Login Here</h4>
        </div>

        <div class="my-3  input-group">
           <i class="bi bi-person-square fs-2 input-group-text"></i>
            <input type="text" placeholder="Username" class="form-control">
            
        </div>


        <div class="my-3 input-group">
            <span class="bi bi-eye-fill fs-2 input-group-text"></span>
            <input type="text" placeholder="Password" class="form-control">
                    
        </div>

        <div>
            <button class="btn btn-success w-100 fs-5">Login</button>
        </div>

    </form>




    <form class="border shadow w-50 m-auto p-4 rounded-2 bg-light">

        <div class="my-2">
            <h3 class="text-muted">Register Here</h3>
        </div>

        <div>
            <label class="form-label">Username:</label>
        </div>

        <div>
            <input type="text" placeholder="Username" name="username" class="form-control">
        </div>


        <div>
            <label class="form-label">Password:</label>
        </div>

        <div>
            <input type="text" placeholder="Password" name="Password" class="form-control">
        </div>


        <div>
            <label class="form-label">Email:</label>
        </div>

        <div>
            <input type="email" placeholder="Email address" name="email" class="form-control">
        </div>



        <div>
            <label class="form-label">Choose Gender:</label>
        </div>


        <div class="d-flex gap-2">


            
        <div class="form-check">
            <input type="radio" name="gender" value="male" class="form-check-input">
            <label class="form-check-label">Male</label>
       </div>


       <div class="form-check">
            <input type="radio" name="gender" value="female" class="form-check-input">
            <label class="form-check-label">Female</label>
       </div>

       <div class="form-check">
            <input type="radio" name="gender" value="other" class="form-check-input">
            <label class="form-check-label">Other</label>
       </div>


        </div>

        <div>
            <label class="form-label">Choose Course:</label>
        </div>


        
        <div class="d-flex gap-2">

            <div class="form-check">
            <input type="checkbox" value="java" name="course" class="form-check-input">
            <label class="form-check-label">Java</label>
        </div>

        <div class="form-check">
            <input type="checkbox" value="python" name="course" class="form-check-input">
            <label class="form-check-label">Python</label>
        </div>


        <div class="form-check">
            <input type="checkbox" value="ui" name="course" class="form-check-input">
            <label class="form-check-label">Ui Tech</label>
        </div>

        <div class="form-check">
            <input type="checkbox" value="react" name="course" class="form-check-input">
            <label class="form-check-label">React</label>
        </div>


        </div>

        <div>
            <label class="form-label">Age:</label>
        </div>

        <div>
            <input type="range" class="form-range">
        </div>
        

        <div>
            <label class="form-label">Select a city</label>
        </div>

        <div>
            <select class="form-select">
                <option>Hyd</option>
                <option>Pune</option>
                <option>Delhi</option>
            </select>
        </div>


        <div class="mt-2 form-switch">
            <input type="checkbox" class="form-check-input">
            <label class="form-check-label">Accept Terms & Conditions</label>
        </div>

        <div class="mt-2">
            <input type="submit" value="Register" class="btn btn-success">
        </div>

       



    </form>

    
   


</body>
</html>
