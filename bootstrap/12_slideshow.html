<!DOCTYPE html>
<html>
<head>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">



<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
  />

<style>
body{
margin-bottom: 500px;
}

.carousel-indicators button {
    width: 20px !important;
    height: 20px !important;
    border-radius: 50%;
}
.carousel-indicators  .active{

    background-color: red;
}

.text-success{
    color:lime !important;
}
.bg-danger{
    background:rgb(231, 102, 102) !important;
}
</style>


</head>
<body>



    
    <h1 class="text-center display-1 fw-bold text-success bg-danger ">Java Full Stack</h1>

<div class="container mt-5">


    <div class="carousel slide" data-bs-ride="carousel" id="hello">



        <div class="carousel-indicators">

            <button data-bs-target="#hello" class="active" data-bs-slide-to="0"></button>
            <button data-bs-target="#hello" data-bs-slide-to="1"></button>
            <button data-bs-target="#hello" data-bs-slide-to="2"></button>

        </div>




        <div class="carousel-inner rounded-3 shadow">
          
        <div class="carousel-item active" data-bs-interval="1000">
            <img src="../images/slider_one.jpg" class="w-100 d-block">
        </div>

        <div class="carousel-item" data-bs-interval="2000">
            <img src="../images/slider_two.jpg" class="w-100 d-block">
        </div>

        <div class="carousel-item"data-bs-interval="4000">
            <img src="../images/slider_three.jpg" class="w-100 d-block">
        </div>

        </div>



        <button class="carousel-control-next">
            <span class="carousel-control-next-icon" data-bs-target="#hello" data-bs-slide="next"></span>
        </button>


          <button class="carousel-control-prev">
            <span class="carousel-control-prev-icon" data-bs-target="#hello" data-bs-slide="prev"></span>
        </button>



    </div>



</div>





</body>
</html>
